server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location ^~ /_next/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = / {
        try_files /index.html =404;
    }

    # D10. The field compiles wasm and drives it from a worker, which needs
    # SharedArrayBuffer, which needs the document to be cross-origin isolated.
    #
    # Scoped to the portfolio rather than set server wide on purpose: COEP
    # require-corp blocks any cross-origin subresource that does not opt in, and
    # the essay pages embed youtube-nocookie.com frames and img.youtube.com
    # thumbnails that do not. Isolating the whole site would take those down to
    # buy a header the rest of the site has no use for.
    #
    # The three spellings are the same document. A regex location outranks the
    # prefix location below, so /portfolio keeps these headers whichever way it
    # is reached.
    location ~ ^/portfolio(?:/|\.html)?$ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files /portfolio.html =404;
    }

    # A wasm module served as application/octet-stream makes
    # WebAssembly.instantiateStreaming refuse it, and the failure reads as a
    # corrupt module rather than a wrong header. Declared here so the answer does
    # not depend on which mime.types the base image happens to ship.
    location ~ \.wasm$ {
        types { }
        default_type application/wasm;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # Next.js static export (trailingSlash: false) writes /essays.html and /essays/slug.html.
    # Check .html first so a folder like /essays does not shadow essays.html.
    location / {
        try_files $uri.html $uri $uri/index.html =404;
    }

    location ~ ^/(.+)/$ {
        rewrite ^/(.+)/$ /$1.html break;
    }

    error_page 404 /404.html;
}
